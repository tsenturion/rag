rag:
  vector_store:
    mode: local
    host: localhost

web:
  # Локальный HTTP; для HTTPS используйте SUPPORT_COOKIE_SECURE=true.
  cookie_secure: false

persistence:
  # Локальный однопроцессный режим не требует отдельного PostgreSQL.
  backend: sqlite

service:
  host: 127.0.0.1

security:
  require_api_key: false
