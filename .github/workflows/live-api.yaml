name: Проверка реальных API

on:
  workflow_dispatch:
    inputs:
      target:
        description: Набор внешних интеграций
        required: true
        default: core
        type: choice
        options:
          - core
          - openai
          - gigachat
          - openweather
          - huggingface
          - all

permissions:
  contents: read

concurrency:
  group: live-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-api:
    name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_CA_BUNDLE_FILE: ${{ github.workspace }}/data/certs/russian_trusted_root_ca_pem.crt
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Настроить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-service.txt

      - name: Проверить корневой сертификат GigaChat
        if: inputs.target == 'core' || inputs.target == 'gigachat' || inputs.target == 'all'
        shell: bash
        run: |
          certificate_fingerprint="$(
            openssl x509 \
              -in "$GIGACHAT_CA_BUNDLE_FILE" \
              -outform DER |
              sha256sum |
              cut -d ' ' -f 1
          )"
          test "$certificate_fingerprint" = \
            'd26d2d0231b7c39f92cc738512ba54103519e4405d68b5bd703e9788ca8ecf31'
          openssl x509 \
            -in "$GIGACHAT_CA_BUNDLE_FILE" \
            -noout \
            -checkend 86400

      - name: Установить зависимости API-проверки
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-service.txt
          python -m pip install "huggingface-hub>=1.1.0"
          python -m pip install --no-deps --editable .

      - name: Выполнить реальные запросы
        run: |
          python scripts/check_live_integrations.py \
            --target "${{ inputs.target }}" \
            --output artifacts/live-api-report.json

      - name: Сохранить безопасный отчёт
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-api-${{ inputs.target }}-report
          path: artifacts/live-api-report.json
          if-no-files-found: warn
          retention-days: 14
